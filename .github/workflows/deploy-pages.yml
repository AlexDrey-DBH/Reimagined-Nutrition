name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate shared navigation
        run: |
          node --test scripts/navigation.test.mjs
          node scripts/sync-navigation.mjs
          node scripts/sync-navigation.mjs --check

      - name: Generate search metadata
        run: |
          node scripts/sync-seo.mjs
          node scripts/sync-seo.mjs --check
          node --test scripts/seo.test.mjs

      - name: Prepare static site artifact
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp specialized-recovery-meals.html _site/
          cp corporate-meals-office-lunches.html _site/
          cp full-service-catering-events.html _site/
          cp nutrition-counseling.html _site/
          cp food-service-consulting.html _site/
          cp about.html _site/
          cp contact-and-inquiry.html _site/
          cp meal-plans-for-aging-parents-and-spouses.html _site/
          cp styles.css _site/
          cp script.js _site/
          cp footer.js _site/
          cp sitemap.xml robots.txt _site/
          cp services-1.html book-online.html _site/
          cp -R rooted _site/rooted
          cp -R assets/. _site/assets/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
