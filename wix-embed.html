<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reimagined Nutrition Embed</title>
    <style>
      :root {
        --ink: #2a2a24;
        --muted: #6e7363;
        --parchment: #f6f3ea;
        --olive: #3d4a2e;
        --sage: #7e9270;
        --soft: #e8eddf;
        --card: #fbfaf5;
        --line: #d8dec9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--parchment);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      .embed {
        margin: 0 auto;
        max-width: 720px;
        padding: 24px 18px;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 28px;
      }

      h1 {
        color: var(--olive);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 1.05;
        margin: 0 0 10px;
      }

      p {
        color: var(--muted);
        margin: 0;
      }

      .note {
        background: var(--soft);
        border-left: 4px solid var(--sage);
        margin-top: 18px;
        padding: 14px 16px;
      }
    </style>
  </head>
  <body>
    <main class="embed">
      <section class="panel" aria-labelledby="embed-title">
        <h1 id="embed-title">Reimagined Nutrition</h1>
        <p>
          This file is the paste-ready Wix HTML embed entry point. Replace this placeholder
          with the finished embed markup, styles, and script.
        </p>
        <p class="note">
          The pasted attachment was incomplete, ending mid-CSS, so the repository is set up
          without treating that partial file as production embed code.
        </p>
      </section>
    </main>
  </body>
</html>
